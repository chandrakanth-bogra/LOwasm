# Serving rules for a LOwasm payload. Paired with Dockerfile.payload.
#
# COOP/COEP are mandatory: threaded WASM needs SharedArrayBuffer. .wasm must be
# application/wasm or the browser refuses to stream-compile it. CORP is
# cross-origin because this image is meant to be served from another host than
# the embedding application; the payload is public static code.
server {
    listen 80;
    root /usr/share/nginx/html;
    index cool.html;

    # add_header does NOT inherit into a location that sets its own, so every
    # location below must repeat the isolation headers.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    etag on;

    location = /cool.html {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # immutable is safe only because this image is deployed under a versioned
    # path (/lowasm/<sha>/); without one, use must-revalidate as serve.sh does.
    location ~ \.(wasm|data)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    gzip_types application/wasm application/octet-stream text/javascript text/css application/json;
    gzip_min_length 4096;

    types {
        text/html html;
        text/javascript js;
        text/css css;
        application/wasm wasm;
        application/json json;
        image/svg+xml svg;
        image/png png;
        font/woff2 woff2;
    }
    # soffice.data.js.metadata has no extension nginx knows; startup stalls
    # silently if it is not served.
    default_type application/octet-stream;

    location / { try_files $uri $uri/ =404; }
}
