# Serving rules for a LOwasm payload. Paired with Dockerfile.payload, and the
# same header set scripts/serve.sh uses for local testing.
#
# Cross-origin isolation is mandatory: the module is threaded WASM and needs
# SharedArrayBuffer, so COOP/COEP go on every response. .wasm must be
# application/wasm or the browser refuses to stream-compile it.
#
# CORP is cross-origin because this image exists to be served from somewhere
# other than the application that embeds it. The payload is public static code,
# so there is nothing to protect by refusing cross-origin embedding. If you
# instead copy these files into the application's own web server -- the
# recommended deployment -- same-origin applies and this header is redundant.
server {
    listen 80;
    root /usr/share/nginx/html;
    index cool.html;

    # nginx add_header does NOT inherit into a location that sets its own, so
    # every location below repeats the isolation headers.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    etag on;

    location = /cool.html {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # The ~280 MB of wasm + filesystem image dominate load. Safe to treat as
    # immutable when the deployment path carries a version (/lowasm/<sha>/);
    # without one, hard-reload after each rebuild.
    location ~ \.(wasm|data)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    gzip_types application/wasm application/octet-stream text/javascript text/css application/json;
    gzip_min_length 4096;

    types {
        text/html html;
        text/javascript js;
        text/css css;
        application/wasm wasm;
        application/json json;
        image/svg+xml svg;
        image/png png;
        font/woff2 woff2;
    }
    # soffice.data.js.metadata has no extension nginx knows, and startup stalls
    # silently if it is not served at all.
    default_type application/octet-stream;

    location / { try_files $uri $uri/ =404; }
}
