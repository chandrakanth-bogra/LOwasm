<!DOCTYPE html>
<!--
  LOWASM: a host page, for testing the embedding API the way a real host uses it.

  The engine no longer fetches documents, so ?WOPISrc=<name> no longer opens
  anything. This page plays the part of the host instead: it fetches a document
  itself and hands the bytes to window.lowasm.load().

      lowasm-test.html?doc=sample.odp

  Documents come from /docs/<name> (scripts/serve.sh mounts a directory there).
  The result is reported both in the page and on window.lowasmTestResult, which
  is what the headless checks read.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>LOwasm embedding test</title>
  <style>
    body { margin: 0; font: 13px/1.5 system-ui, sans-serif; }
    #status { padding: 6px 10px; background: #f4f4f4; border-bottom: 1px solid #ddd;
              font-variant-numeric: tabular-nums; }
    #status.err { background: #fdecea; }
    #frame { position: relative; height: calc(100vh - 34px); }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div id="status">starting…</div>
  <div id="frame"><iframe id="engine"></iframe></div>

  <script>
    // The engine keeps owning cool.html (its ~70 DOM ids and global CSS), so this
    // page frames it and drives it through the iframe's window. Same origin, so
    // window.lowasm is reachable directly -- no postMessage needed. A same-page
    // host would skip the iframe and call window.lowasm itself.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var doc = params.get('doc') || 'sample.odp';
      var statusEl = document.getElementById('status');
      var started = Date.now();

      function show(text, isError) {
        statusEl.textContent = text;
        statusEl.className = isError ? 'err' : '';
      }

      function elapsed() {
        return ((Date.now() - started) / 1000).toFixed(1) + 's';
      }

      function fail(stage, detail) {
        window.lowasmTestResult = { ok: false, stage: stage, detail: String(detail) };
        show('FAILED at ' + stage + ': ' + detail, true);
      }

      var frame = document.getElementById('engine');

      // Pass ?loglevel= through to the engine, so a diagnostic run can raise the
      // engine's log level (it ships at "error") without a rebuild. The src is
      // set here rather than in the markup so the load handler is attached first.
      var loglevel = params.get('loglevel');
      var engineSrc = 'cool.html' + (loglevel ? '?loglevel=' + encodeURIComponent(loglevel) : '');

      frame.addEventListener('load', function () {
        var win = frame.contentWindow;
        if (!win.lowasm) {
          fail('api', 'window.lowasm is missing from cool.html');
          return;
        }

        win.lowasm.on('error', function (e) { fail('engine', e.status); });
        win.lowasm.on('saved', function (e) {
          window.lowasmSaved = { name: e.name, length: e.bytes.length };
          show('saved ' + e.name + ' (' + e.bytes.length + ' bytes) in ' + elapsed());
        });

        show('waiting for the engine…');
        win.lowasm.ready
          .then(function () {
            show('engine ready in ' + elapsed() + ', fetching ' + doc + '…');
            return fetch('docs/' + encodeURIComponent(doc));
          })
          .then(function (res) {
            if (!res.ok)
              throw new Error('HTTP ' + res.status + ' for docs/' + doc);
            return res.arrayBuffer();
          })
          .then(function (buf) {
            show('loading ' + doc + ' (' + buf.byteLength + ' bytes)…');
            return win.lowasm.load(doc, buf);
          })
          .then(function (detail) {
            window.lowasmTestResult = {
              ok: true,
              name: detail.name,
              docType: detail.docType,
              pages: detail.pages,
              seconds: Number(((Date.now() - started) / 1000).toFixed(1)),
            };
            show('loaded ' + detail.name + ' — ' + detail.docType +
                 ', pages: ' + detail.pages + ' — in ' + elapsed());
          })
          .catch(function (e) { fail('load', e && e.message ? e.message : e); });
      });

      frame.src = engineSrc;
    })();
  </script>
</body>
</html>
